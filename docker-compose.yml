services:
  app:
    build: .
    image: voice-to-categories:latest
    restart: unless-stopped
    ports:
      # host:container — change the host side (or PORT below) if 3000 is taken
      - '${APP_PORT:-3000}:3000'
    environment:
      PORT: 3000
      DATABASE_PATH: /app/data/app.db
      AUDIO_DIR: /app/data/audio
      # SvelteKit adapter-node needs ORIGIN for correct URLs/csrf.
      # Precedence: ORIGIN → Coolify's FQDN → http://localhost:3000
      ORIGIN: ${ORIGIN:-${COOLIFY_FQDN:-http://localhost:3000}}
    env_file:
      # .env is gitignored and usually absent on the deploy server (e.g. Coolify);
      # secrets should be set as environment variables in the platform UI instead.
      - path: .env
        required: false
    volumes:
      - app-data:/app/data

volumes:
  app-data:
